<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog Layanan - Raja Production</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Import Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { blush: { 50: '#fdf8f8', 100: '#f9ecec', 200: '#f4dada', 300: '#ecc1c1', 400: '#e09f9f', 500: '#d17878', 600: '#be5c5c', 700: '#9f4848', 800: '#843f3f', 900: '#6f3737' } }
                }
            }
        }
    </script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-white px-4 py-4 shadow-sm sticky top-0 z-30">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blush-100 rounded-full flex items-center justify-center text-blush-600">
                    <i class="ph ph-flower-lotus text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-serif font-bold text-xl text-slate-900">RAJA PRODUCTION</h1>
                    <p class="text-[10px] sm:text-xs text-slate-500">Booking Layanan Wedding Organizer</p>
                </div>
            </div>
            <!-- Tombol Keranjang Desktop -->
            <button onclick="toggleCart()" class="hidden md:flex items-center gap-2 bg-blush-50 text-blush-700 px-4 py-2 rounded-full font-semibold hover:bg-blush-100 transition-colors">
                <i class="ph ph-shopping-bag text-xl"></i>
                <span id="desktop-cart-count">0 Pesanan</span>
            </button>
        </div>
    </header>

    <!-- Kategori Filter -->
    <div class="bg-white border-b border-slate-100 mb-4 sticky top-[72px] z-20">
        <div class="max-w-4xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto hide-scroll" id="category-container">
            <!-- Kategori dimuat via JS -->
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4">
        <!-- Grid Produk -->
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4" id="product-grid">
            <div class="col-span-full py-20 text-center flex flex-col items-center justify-center">
                <i class="ph ph-spinner-gap text-4xl text-blush-500 animate-spin mb-3"></i>
                <p class="text-slate-500 text-sm">Memuat daftar layanan...</p>
            </div>
        </div>
    </main>

    <!-- Tombol Keranjang Mobile Mengambang -->
    <button onclick="toggleCart()" class="md:hidden fixed bottom-6 right-6 bg-blush-600 text-white px-5 py-3 rounded-full shadow-xl shadow-blush-200 z-[50] flex items-center gap-2 transition-transform duration-300 hover:scale-105 active:scale-95">
        <i class="ph ph-shopping-bag text-2xl"></i>
        <span class="font-bold text-sm border-l border-white/30 pl-2 ml-1" id="mobile-cart-count">0 Item</span>
    </button>

    <!-- PANEL KERANJANG & FORM BOOKING (Slide dari Kanan) -->
    <div id="cart-panel" class="fixed inset-y-0 right-0 w-full md:w-[450px] bg-white shadow-2xl z-[100] transform transition-transform duration-300 translate-x-full flex flex-col">
        <!-- Header Cart -->
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-blush-50">
            <h2 class="font-serif font-bold text-lg text-slate-800">Detail Booking Anda</h2>
            <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm text-slate-500">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>

        <!-- Scrollable Area -->
        <div class="flex-1 overflow-y-auto bg-slate-50/50 p-4 space-y-5">
            
            <!-- Daftar Barang -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Layanan Terpilih</h3>
                <div id="cart-items" class="space-y-3">
                    <p class="text-sm text-slate-500 text-center py-4">Belum ada layanan dipilih.</p>
                </div>
            </div>

            <!-- Formulir Data Diri -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 space-y-3" id="booking-form" style="display: none;">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Data Pemesan</h3>
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block">Nama Lengkap Pemesan/Pengantin <span class="text-red-500">*</span></label>
                    <input type="text" id="cust-name" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blush-400 focus:ring-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block">Nomor WhatsApp Aktif <span class="text-red-500">*</span></label>
                    <input type="tel" id="cust-phone" placeholder="Contoh: 081234567890" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blush-400 focus:ring-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block">Tanggal Acara <span class="text-red-500">*</span></label>
                    <input type="date" id="cust-date" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blush-400 focus:ring-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 mb-1 block">Alamat Lengkap Acara</label>
                    <textarea id="cust-address" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blush-400 focus:ring-1" placeholder="Nama desa/gedung, jalan, kecamatan..."></textarea>
                </div>
            </div>

        </div>

        <!-- Total & Tombol Checkout -->
        <div class="p-4 bg-white border-t border-slate-100 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between items-end mb-3">
                <span class="text-sm font-semibold text-slate-500">Estimasi Total Biaya</span>
                <span class="text-xl font-bold text-blush-600" id="cart-total">Rp 0</span>
            </div>
            <button onclick="processBooking()" id="btn-booking" class="w-full bg-blush-600 hover:bg-blush-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blush-200 flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <i class="ph ph-whatsapp text-xl"></i> Lanjutkan ke WhatsApp
            </button>
            <p class="text-[10px] text-center text-slate-400 mt-2">Biaya di atas belum termasuk biaya tambahan transport (jika ada).</p>
        </div>
    </div>

    <!-- Overlay Latar Belakang Gelap -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[90] hidden transition-opacity opacity-0"></div>

    <script>
        // ==========================================
        // KONFIGURASI PENTING
        // ==========================================
        // 1. Nomor WA Admin Anda (Gunakan kode negara 62)
        const NO_WA_ADMIN = '6281234567890'; // GANTI DENGAN NOMOR WA ANDA
        
        // 2. Kredensial Supabase (Sama dengan POS)
        const SUPABASE_URL = 'https://fuwxhhfskzvqombvdukt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1d3hoaGZza3p2cW9tYnZkdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODczMjcsImV4cCI6MjA5NjU2MzMyN30.grscW_DU4L_xswpb2BYY2WL9hOya3WXjF5VSkAxL93A';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let categories = ['Semua'];
        let currentCategory = 'Semua';
        let cart = [];
        let isCartOpen = false;

        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);

        // Fetch Data Layanan dari Supabase
        const fetchProducts = async () => {
            try {
                const { data, error } = await supabaseClient.from('services').select('*').order('id', { ascending: true });
                if (error) throw error;
                products = data;
                
                // Ambil kategori unik
                const uniqueCats = [...new Set(products.map(p => p.category))];
                categories = ['Semua', ...uniqueCats];
                
                renderCategories();
                renderProducts();
            } catch (err) {
                console.error("Gagal memuat produk:", err);
                document.getElementById('product-grid').innerHTML = '<div class="col-span-full text-center text-red-500 py-10">Gagal memuat data. Periksa koneksi internet.</div>';
            }
        };

        const renderCategories = () => {
            document.getElementById('category-container').innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors border ${currentCategory === cat ? 'bg-blush-600 text-white border-blush-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:border-blush-300 hover:text-blush-600'}">${cat}</button>
            `).join('');
        };

        const setCategory = (cat) => { currentCategory = cat; renderCategories(); renderProducts(); };

        const renderProducts = () => {
            const grid = document.getElementById('product-grid');
            const filtered = currentCategory === 'Semua' ? products : products.filter(p => p.category === currentCategory);
            
            if(filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-400 py-10">Belum ada layanan di kategori ini.</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-100 flex flex-col justify-between h-full relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-1 ${p.color ? p.color.split(' ')[0] : 'bg-slate-200'}"></div>
                    <div class="flex-1 mt-1">
                        <span class="text-[9px] font-bold tracking-wider uppercase text-slate-400 block mb-1">${p.category}</span>
                        <h3 class="text-sm font-bold text-slate-800 leading-tight mb-2">${p.name}</h3>
                        <p class="font-bold text-blush-600 text-sm">${formatRupiah(p.price)}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="mt-4 w-full bg-slate-50 hover:bg-blush-50 text-slate-600 hover:text-blush-600 border border-slate-200 hover:border-blush-300 font-semibold py-2 rounded-lg text-xs transition-colors flex items-center justify-center gap-1">
                        <i class="ph ph-shopping-cart-simple text-sm"></i> Tambah
                    </button>
                </div>
            `).join('');
        };

        // Manajemen Keranjang Pelanggan
        const addToCart = (id) => {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) existing.qty += 1; else cart.push({ ...product, qty: 1 });
            
            // Animasi tombol tambah
            updateCartUI();
            
            // Beri notif singkat ke user bahwa barang ditambahkan (Bounce keranjang)
            const mobileBtn = document.querySelector('button.md\\:hidden');
            mobileBtn.classList.add('scale-110'); setTimeout(() => mobileBtn.classList.remove('scale-110'), 200);
        };

        const updateCartQty = (id, delta) => {
            const idx = cart.findIndex(i => i.id === id);
            if (idx > -1) { cart[idx].qty += delta; if (cart[idx].qty <= 0) cart.splice(idx, 1); updateCartUI(); }
        };

        const updateCartUI = () => {
            const container = document.getElementById('cart-items');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            
            document.getElementById('mobile-cart-count').textContent = `${totalItems} Item`;
            document.getElementById('desktop-cart-count').textContent = `${totalItems} Pesanan`;
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-500 text-center py-4">Belum ada layanan dipilih.</p>';
                document.getElementById('booking-form').style.display = 'none';
                document.getElementById('btn-booking').disabled = true;
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center gap-2 border-b border-slate-50 pb-2 last:border-0 last:pb-0">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-semibold text-slate-800 truncate">${item.name}</h4>
                            <div class="font-medium text-blush-600 text-xs">${formatRupiah(item.price)}</div>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg p-0.5">
                            <button onclick="updateCartQty(${item.id}, -1)" class="w-6 h-6 flex justify-center items-center text-slate-500 hover:text-blush-600"><i class="ph ph-minus text-xs"></i></button>
                            <span class="text-xs font-semibold w-4 text-center">${item.qty}</span>
                            <button onclick="updateCartQty(${item.id}, 1)" class="w-6 h-6 flex justify-center items-center text-slate-500 hover:text-blush-600"><i class="ph ph-plus text-xs"></i></button>
                        </div>
                    </div>
                `).join('');
                document.getElementById('booking-form').style.display = 'block';
                document.getElementById('btn-booking').disabled = false;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total').textContent = formatRupiah(totalAmount);
        };

        // Buka/Tutup Keranjang
        const toggleCart = () => {
            const panel = document.getElementById('cart-panel');
            const overlay = document.getElementById('cart-overlay');
            isCartOpen = !isCartOpen;
            
            if (isCartOpen) {
                panel.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                panel.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        };

        // Proses Pemesanan (Simpan ke Supabase & Buka WA)
        const processBooking = async () => {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const dateStr = document.getElementById('cust-date').value;
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !dateStr) {
                alert("Harap lengkapi Nama, No. WhatsApp, dan Tanggal Acara terlebih dahulu!");
                return;
            }

            const btn = document.getElementById('btn-booking');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin text-xl"></i> Sedang Memproses...';
            btn.disabled = true;

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            try {
                // 1. Simpan Transaksi dengan status 'pending'
                const { data: trxData, error: trxError } = await supabaseClient
                    .from('transactions')
                    .insert([{
                        client_name: name,
                        phone: phone,
                        address: address,
                        event_date: dateStr,
                        subtotal: totalAmount,
                        total: totalAmount,
                        status: 'pending' // PENANDA ORDER ONLINE
                    }])
                    .select();

                if (trxError) throw trxError;
                const trxId = trxData[0].id;

                // 2. Simpan Item Detail
                const itemsToInsert = cart.map(item => ({
                    transaction_id: trxId,
                    service_id: item.id,
                    service_name: item.name,
                    qty: item.qty,
                    price: item.price
                }));

                const { error: itemsError } = await supabaseClient.from('transaction_items').insert(itemsToInsert);
                if (itemsError) throw itemsError;

                // 3. Buat Format Pesan WhatsApp
                const formatTgl = new Date(dateStr).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
                let waMessage = `Halo *Raja Production*, saya ingin booking layanan WO untuk:\n\n`;
                waMessage += `*Nama:* ${name}\n`;
                waMessage += `*No. WA:* ${phone}\n`;
                waMessage += `*Tgl Acara:* ${formatTgl}\n`;
                if(address) waMessage += `*Alamat:* ${address}\n`;
                
                waMessage += `\n*Detail Pesanan:*\n`;
                cart.forEach(i => {
                    waMessage += `- ${i.qty}x ${i.name} (${formatRupiah(i.price)})\n`;
                });
                
                waMessage += `\n*Estimasi Total:* ${formatRupiah(totalAmount)}\n\n`;
                waMessage += `Apakah jadwal untuk tanggal tersebut masih kosong dan bisa dibooking? Terima kasih.`;

                // Bersihkan Keranjang
                cart = []; updateCartUI(); toggleCart();
                document.getElementById('cust-name').value = '';
                document.getElementById('cust-phone').value = '';
                document.getElementById('cust-date').value = '';
                document.getElementById('cust-address').value = '';

                // Arahkan ke WhatsApp Admin
                const waUrl = `https://wa.me/${62859117473377}?text=${encodeURIComponent(waMessage)}`;
                window.location.href = waUrl;

            } catch (err) {
                console.error("Booking Error:", err);
                alert("Maaf, terjadi kesalahan pada server kami saat menyimpan pesanan. Silakan coba lagi.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.onload = fetchProducts;
    </script>
</body>
</html>
