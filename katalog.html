<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog Raja Production</title>
    <!-- [WAJIB UNTUK PWA] -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#be5c5c">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Import Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        blush: {
                            50: '#fdf8f8',
                            100: '#f9ecec',
                            200: '#f4dada',
                            300: '#ecc1c1',
                            400: '#e09f9f',
                            500: '#d17878',
                            600: '#be5c5c',
                            700: '#9f4848',
                            800: '#843f3f',
                            900: '#6f3737',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Sembunyikan panah default pada input number agar terlihat lebih rapi */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        /* Loader untuk Supabase */
        #global-loader { transition: opacity 0.3s; }
    </style>
</head>
<body class="bg-blush-50 text-slate-800 font-sans h-screen overflow-hidden flex flex-col relative">

    <!-- Global Loader overlay -->
    <div id="global-loader" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[200] flex flex-col items-center justify-center">
        <i class="ph ph-spinner-gap text-5xl text-blush-600 animate-spin mb-3"></i>
        <p class="text-sm font-medium text-slate-600" id="loader-text">Memuat Katalog Layanan...</p>
    </div>

    <!-- Header Katalog -->
    <header class="bg-white px-4 md:px-6 py-3 md:py-4 shadow-sm flex justify-between items-center z-30 flex-shrink-0 border-b border-blush-100">
        <div class="flex items-center gap-2 md:gap-3">
            <div class="w-8 h-8 md:w-10 md:h-10 bg-blush-100 rounded-full flex items-center justify-center text-blush-600">
                <i class="ph ph-flower-lotus text-xl md:text-2xl"></i>
            </div>
            <div>
                <h1 class="font-serif font-bold text-lg md:text-xl text-slate-900">RAJA PRODUCTION</h1>
                <p class="text-[10px] md:text-xs text-slate-500">Pemesanan Online</p>
            </div>
        </div>
        
        <!-- Tombol Keranjang -->
        <button onclick="toggleCart()" class="relative w-10 h-10 rounded-full bg-blush-50 text-blush-600 hover:bg-blush-100 flex items-center justify-center transition-colors shadow-sm cursor-pointer" title="Lihat Booking">
            <i class="ph ph-shopping-bag text-xl pointer-events-none"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border border-white hidden">0</span>
        </button>
    </header>

    <!-- Konten Utama (Katalog) -->
    <div class="flex-1 flex flex-col h-full bg-blush-50 relative overflow-hidden" id="main-catalog-view">
        <!-- Kategori Filter -->
        <div class="px-4 md:px-6 py-3 md:py-4 bg-white flex-shrink-0">
            <div class="flex gap-2 overflow-x-auto hide-scroll pb-2" id="category-container"></div>
        </div>

        <!-- Grid Produk -->
        <div class="flex-1 overflow-y-auto px-4 md:px-6 py-4 md:py-6 bg-slate-50/50">
            <div class="max-w-6xl mx-auto">
                <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4" id="product-grid"></div>
            </div>
        </div>
    </div>

    <!-- Panel Keranjang / Booking (Slide up/left) -->
    <div class="fixed inset-y-0 right-0 w-full md:w-[450px] bg-white shadow-2xl h-full flex flex-col z-[60] transform transition-transform duration-300 translate-x-full" id="cart-panel">
        
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white shadow-sm z-10 flex-shrink-0">
            <h2 class="font-serif font-bold text-lg text-slate-800">Detail Booking Anda</h2>
            <button onclick="toggleCart()" class="text-slate-500 hover:text-slate-800 bg-slate-50 w-8 h-8 rounded-full flex items-center justify-center border border-slate-200 transition-colors">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>

        <!-- Area Scroll: List Item & Form Data Diri -->
        <div class="flex-1 overflow-y-auto bg-slate-50/50 flex flex-col">
            
            <!-- Daftar Barang Terpilih -->
            <div class="p-5 flex-shrink-0">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Layanan Terpilih</h3>
                <div id="cart-items" class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="py-10 flex flex-col items-center justify-center text-slate-400 space-y-3" id="empty-cart-msg">
                        <i class="ph ph-shopping-bag text-5xl opacity-50"></i>
                        <p class="text-sm font-medium">Belum ada paket dipilih</p>
                    </div>
                </div>
            </div>

            <!-- Form Data Pemesan -->
            <div class="p-5 border-t border-slate-100 bg-white flex-shrink-0 mt-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Data Pemesan</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1.5 flex items-center gap-1">
                            Nama Lengkap Pemesan/Pengantin <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="customer-name" placeholder="Misal: Budi & Ani" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blush-400 focus:ring-1 focus:ring-blush-400 transition-colors" required>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1.5 flex items-center gap-1">
                            Nomor WhatsApp Aktif <span class="text-red-500">*</span>
                        </label>
                        <input type="tel" id="customer-phone" placeholder="Contoh: 081234567890" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blush-400 focus:ring-1 focus:ring-blush-400 transition-colors" required>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1.5 flex items-center gap-1">
                            Tanggal Acara <span class="text-red-500">*</span>
                        </label>
                        <input type="date" id="customer-date" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blush-400 focus:ring-1 focus:ring-blush-400 transition-colors" required>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1.5 flex items-center gap-1">
                            Alamat Lengkap Acara
                        </label>
                        <textarea id="customer-address" rows="3" placeholder="Tuliskan alamat lengkap lokasi acara..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blush-400 focus:ring-1 focus:ring-blush-400 transition-colors resize-none"></textarea>
                    </div>
                </div>
            </div>

        </div> <!-- Akhir area scroll -->

        <!-- Footer Total & Tombol Checkout -->
        <div class="p-5 border-t border-slate-100 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] flex-shrink-0 z-20">
            <div class="flex justify-between items-center mb-4">
                <span class="font-medium text-slate-500">Estimasi Total Biaya</span>
                <span class="text-xl font-bold text-blush-600" id="summary-total">Rp 0</span>
            </div>
            
            <button onclick="processCheckout()" class="w-full bg-blush-600 hover:bg-blush-700 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-blush-200 flex justify-center items-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed" id="btn-checkout" disabled>
                <span>Lanjutkan ke WhatsApp</span>
                <i class="ph ph-whatsapp-logo text-xl group-hover:scale-110 transition-transform"></i>
            </button>
            <p class="text-[10px] text-center text-slate-400 mt-3">Biaya di atas belum termasuk biaya tambahan transport (jika ada).</p>
        </div>
    </div>

    <!-- Overlay Latar Belakang Hitam (saat keranjang dibuka) -->
    <div id="cart-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[50] hidden transition-opacity opacity-0" onclick="toggleCart()"></div>

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // ==========================================
        // KONEKSI SUPABASE (SAMA DENGAN ADMIN)
        // ==========================================
        const SUPABASE_URL = 'https://fuwxhhfskzvqombvdukt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1d3hoaGZza3p2cW9tYnZkdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODczMjcsImV4cCI6MjA5NjU2MzMyN30.grscW_DU4L_xswpb2BYY2WL9hOya3WXjF5VSkAxL93A';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // NOMOR WA ADMIN (GANTI DENGAN NOMOR ANDA)
        // Format: 6281xxxx (tanpa + atau 0 di depan)
        const NO_WA_ADMIN = '6281234567890'; 

        // State Global
        let products = [];
        let categories = ['Semua'];
        let cart = [];
        let currentCategory = 'Semua';
        let total = 0;

        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);

        const showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `bg-slate-800 text-white px-4 py-2 rounded-full text-sm shadow-lg transform transition-all duration-300 translate-y-[-20px] opacity-0 flex items-center gap-2`;
            toast.innerHTML = `<i class="ph ${isError ? 'ph-warning-circle text-red-400' : 'ph-check-circle text-emerald-400'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-[-20px]', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); }, 10);
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-[-20px]', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        };

        const showLoader = (show, text = 'Memuat...') => {
            const loader = document.getElementById('global-loader');
            document.getElementById('loader-text').textContent = text;
            if (show) { loader.classList.remove('hidden'); setTimeout(() => loader.classList.remove('opacity-0'), 10); } 
            else { loader.classList.add('opacity-0'); setTimeout(() => loader.classList.add('hidden'), 300); }
        };

        // ==========================================
        // FUNGSI FETCH PRODUK
        // ==========================================
        const fetchProducts = async () => {
            showLoader(true, 'Memuat Katalog Layanan...');
            try {
                const { data, error } = await supabaseClient.from('services').select('*').order('category', { ascending: true });
                if (error) throw error;
                products = data;
                updateCategoriesList();
            } catch (err) {
                console.error("Fetch Error:", err);
                showToast("Gagal memuat data dari server.", true);
            } finally {
                showLoader(false);
            }
        };

        const updateCategoriesList = () => {
            const uniqueCats = [...new Set(products.map(p => p.category))];
            categories = ['Semua', ...uniqueCats];
            if(!categories.includes(currentCategory)) currentCategory = 'Semua';
            renderCategories();
            renderProducts();
        };

        const renderCategories = () => {
            document.getElementById('category-container').innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-5 py-2 rounded-full text-sm font-medium transition-colors border ${currentCategory === cat ? 'bg-blush-600 text-white border-blush-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:border-blush-300 hover:text-blush-600'}">${cat}</button>
            `).join('');
        };

        const setCategory = (cat) => { currentCategory = cat; renderCategories(); renderProducts(); };

        const renderProducts = () => {
            const grid = document.getElementById('product-grid');
            const filtered = currentCategory === 'Semua' ? products : products.filter(p => p.category === currentCategory);
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400"><i class="ph ph-cube text-4xl mb-2 opacity-50"></i><p>Tidak ada layanan tersedia.</p></div>`;
                return;
            }
            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition-shadow flex flex-col justify-between h-full group relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 ${p.color ? p.color.split(' ')[0] : 'bg-slate-200'}"></div>
                    <div class="flex-1 mt-2">
                        <span class="inline-block bg-slate-50 text-slate-500 text-[9px] font-bold tracking-wider uppercase px-2 py-0.5 rounded mb-2">${p.category}</span>
                        <h3 class="text-sm font-bold text-slate-800 leading-snug mb-1">${p.name}</h3>
                        <p class="font-bold text-blush-600 text-sm mt-3">${formatRupiah(p.price)}</p>
                    </div>
                    <div class="mt-4 pt-4 border-t border-slate-50">
                        <button onclick="addToCart(${p.id})" class="w-full bg-blush-50 hover:bg-blush-600 text-blush-600 hover:text-white border border-blush-100 hover:border-blush-600 font-medium py-2 rounded-xl transition-colors flex justify-center items-center gap-2 text-xs">
                            <i class="ph ph-plus font-bold"></i> Tambah ke Booking
                        </button>
                    </div>
                </div>
            `).join('');
        };

        // ==========================================
        // MANAJEMEN KERANJANG (BOOKING)
        // ==========================================
        const addToCart = (id) => {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) existing.qty += 1; else cart.push({ ...product, qty: 1 });
            showToast(`${product.name} ditambahkan!`);
            updateCartUI();
        };

        const updateCartQty = (id, delta) => {
            const idx = cart.findIndex(i => i.id === id);
            if (idx > -1) { cart[idx].qty += delta; if (cart[idx].qty <= 0) cart.splice(idx, 1); updateCartUI(); }
        };
        
        // FUNGSI BARU: Mengatur Qty melalui input keyboard langsung di keranjang katalog
        const setCartQty = (id, newQty) => {
            const qty = parseInt(newQty);
            const idx = cart.findIndex(i => i.id === id);
            if (idx > -1) { 
                if (isNaN(qty) || qty <= 0) { 
                    cart.splice(idx, 1); 
                } else {
                    cart[idx].qty = qty; 
                }
                updateCartUI(); 
            }
        };

        const removeFromCart = (id) => { cart = cart.filter(i => i.id !== id); updateCartUI(); };

        const updateCartUI = () => {
            const container = document.getElementById('cart-items');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-badge');
            
            if (badge) {
                if (totalItems > 0) {
                    badge.textContent = totalItems;
                    badge.classList.remove('hidden');
                    // Efek mantul
                    badge.parentElement.classList.add('scale-110');
                    setTimeout(() => badge.parentElement.classList.remove('scale-110'), 200);
                } else {
                    badge.classList.add('hidden');
                }
            }

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="py-10 flex flex-col items-center justify-center text-slate-400 space-y-3" id="empty-cart-msg">
                        <i class="ph ph-shopping-bag text-5xl opacity-50"></i>
                        <p class="text-sm font-medium">Belum ada layanan dipilih</p>
                    </div>`;
            } else {
                container.innerHTML = cart.map((item, index) => `
                    <div class="p-4 ${index !== cart.length -1 ? 'border-b border-slate-100' : ''} flex flex-col sm:flex-row sm:items-center justify-between gap-3 animate-fade-in">
                        <div class="flex-1">
                            <h4 class="text-sm font-semibold text-slate-800">${item.name}</h4>
                            <div class="text-xs text-blush-600 font-medium">${formatRupiah(item.price)}</div>
                        </div>
                        <div class="flex items-center justify-between sm:justify-end gap-4">
                            <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-lg px-1 py-0.5">
                                <button onclick="updateCartQty(${item.id}, -1)" class="w-7 h-7 flex justify-center items-center text-slate-500 hover:text-blush-600"><i class="ph ph-minus"></i></button>
                                
                                <!-- Input Number Bisa Diketik Manual -->
                                <input type="number" min="1" value="${item.qty}" onchange="setCartQty(${item.id}, this.value)" class="w-10 text-center bg-transparent focus:outline-none focus:bg-white focus:ring-1 focus:ring-blush-200 rounded text-xs font-semibold text-slate-800 p-1 m-0 appearance-none">
                                
                                <button onclick="updateCartQty(${item.id}, 1)" class="w-7 h-7 flex justify-center items-center text-slate-500 hover:text-blush-600"><i class="ph ph-plus"></i></button>
                            </div>
                            <button onclick="removeFromCart(${item.id})" class="text-slate-300 hover:text-red-500 transition-colors bg-red-50 w-7 h-7 rounded flex items-center justify-center">
                                <i class="ph ph-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            
            calculateTotal();
        };

        const calculateTotal = () => {
            total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('summary-total').textContent = formatRupiah(total);
            
            // Tombol aktif jika cart ada isi
            document.getElementById('btn-checkout').disabled = cart.length === 0;
        };

        // ==========================================
        // UI TOGGLES
        // ==========================================
        let isCartOpen = false;
        const toggleCart = () => {
            const panel = document.getElementById('cart-panel');
            const overlay = document.getElementById('cart-overlay');
            
            isCartOpen = !isCartOpen;
            
            if(isCartOpen) { 
                panel.classList.remove('translate-x-full'); 
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else { 
                panel.classList.add('translate-x-full'); 
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        };

        // ==========================================
        // CHECKOUT & WHATSAPP
        // ==========================================
        const processCheckout = async () => {
            // Validasi Input
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const dateRaw = document.getElementById('customer-date').value;
            const address = document.getElementById('customer-address').value.trim();

            if(!name || !phone || !dateRaw) {
                showToast("Harap isi Nama, No. WhatsApp, dan Tanggal Acara!", true);
                return;
            }

            if(cart.length === 0) return;

            const btnCheckout = document.getElementById('btn-checkout');
            const originalBtnText = btnCheckout.innerHTML;
            btnCheckout.innerHTML = '<i class="ph ph-spinner-gap animate-spin text-xl"></i> Sedang Memproses...';
            btnCheckout.disabled = true;

            try {
                // 1. Simpan Transaksi Master ke Supabase dengan status 'pending'
                const { data: trxData, error: trxError } = await supabaseClient
                    .from('transactions')
                    .insert([{
                        client_name: name,
                        event_date: dateRaw,
                        subtotal: total,
                        discount: 0,
                        total: total,
                        dp: 0,
                        payment_method: 'Online Booking',
                        status: 'pending', // <--- Penanda bahwa ini order masuk belum diproses
                        customer_phone: phone,
                        event_address: address
                    }])
                    .select();

                if (trxError) throw trxError;
                const trxId = trxData[0].id;

                // 2. Simpan Item Detail Transaksi
                const itemsToInsert = cart.map(item => ({
                    transaction_id: trxId,
                    service_id: item.id,
                    service_name: item.name,
                    qty: item.qty,
                    price: item.price
                }));

                const { error: itemsError } = await supabaseClient.from('transaction_items').insert(itemsToInsert);
                if (itemsError) throw itemsError;

                // 3. Susun Pesan WhatsApp
                const formatWaDate = new Date(dateRaw).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
                
                let waText = `Assalamualaikum *RAJA PRODUCTION*,\nSaya ingin melakukan pemesanan booking dengan detail berikut:\n\n`;
                waText += `*DATA PEMESAN:*\n`;
                waText += `- Nama: ${name}\n`;
                waText += `- No. WA: ${phone}\n`;
                waText += `- Tgl Acara: ${formatWaDate}\n`;
                if(address) waText += `- Alamat: ${address}\n`;
                
                waText += `\n*LAYANAN DIPILIH:*\n`;
                cart.forEach(item => {
                    waText += `- ${item.qty}x ${item.name} (${formatRupiah(item.price * item.qty)})\n`;
                });
                
                waText += `\n*Estimasi Total: ${formatRupiah(total)}*\n\n`;
                waText += `_ID Booking: #${trxId.split('-')[0].toUpperCase()}_\n`;
                waText += `Tolong info total biaya (beserta transport) dan nomor rekening untuk transfer DP. Terima kasih!`;

                // Encode pesan untuk URL
                const encodedText = encodeURIComponent(waText);
                
                // Reset Keranjang & Form
                cart = [];
                updateCartUI();
                document.getElementById('customer-name').value = '';
                document.getElementById('customer-phone').value = '';
                document.getElementById('customer-date').value = '';
                document.getElementById('customer-address').value = '';
                toggleCart();
                
                showToast("Pesanan berhasil dibuat! Mengalihkan ke WhatsApp...");

                // Buka WhatsApp
                setTimeout(() => {
                    window.open(`https://wa.me/${62859117473377}?text=${encodedText}`, '_blank');
                }, 1500);

            } catch (err) {
                console.error("Checkout Error:", err);
                showToast("Terjadi kesalahan saat menyimpan pesanan.", true);
            } finally {
                btnCheckout.innerHTML = originalBtnText;
                btnCheckout.disabled = cart.length === 0;
            }
        };

        // Init
        window.onload = () => {
            // Jalankan Service Worker untuk PWA jika ada
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail:', err));
            }
            fetchProducts();
        };
    </script>
</body>
